[package]
name = "borehole-log-studio"
version = "0.4.0"
description = "Offline desktop borehole log editor"
authors = ["Borehole Log Studio"]
edition = "2021"

[lib]
name = "borehole_log_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
